name: build-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk rawcam.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rawcam-debug-apk
          path: rawcam.apk
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest rawcam.apk \
            --title "RawCam (último build)" \
            --notes "Build de ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)" \
            --prerelease --target "$GITHUB_SHA"
